name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_TIME="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildTime=${BUILD_TIME}"
          BINARY="pmbot-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p dist
          go build -trimpath -ldflags="${LDFLAGS}" -o "dist/${BINARY}" ./cmd/pmbot
          echo "built: dist/${BINARY}"

      - name: UPX compress
        # UPX does not support darwin and cross-arch arm64 binaries may fail;
        # only compress linux/amd64 which is the primary deployment target.
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq upx-ucl
          BINARY="pmbot-${{ matrix.goos }}-${{ matrix.goarch }}"
          cp "dist/${BINARY}" "dist/${BINARY}-upx"
          upx --best --lzma "dist/${BINARY}-upx"
          echo "compressed: dist/${BINARY}-upx"

      - uses: actions/upload-artifact@v4
        with:
          name: pmbot-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
